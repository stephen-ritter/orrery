# chief operations plant (ROADMAP P4a, decision D7): the full vehicle minus
# thrusters, as a bskforge TOML. Pure plant on purpose - NO [spacecraft.fsw]:
# the flight software lives in cFS and commands through the lockstep link.
#
#   uv run python -m sim.forge_scenario --scenario sim/scenarios/chief.toml --duration 60
#
# Physics deltas from detumble_forge.toml (which stays frozen as the W3 parity
# witness): actuation moves to the reaction wheels, the scan grid drops to
# 0.1 s (wheel/sensor reality; the rig ticks on the 1 s control boundaries),
# and the rate knowledge comes from the simulated IMU, not a Python model.

[simulation]
name = "chief operations plant"
duration = 120.0

[simulation.dt]
dynamics = 0.1
# fsw is the FSW tick: the world gate, sensor frames, beacon and every
# anchored digest ride this rate. It must stay an integer multiple of
# dynamics, and retuning it re-anchors every baseline - full ceremony.
fsw = 1.0

[world]
central_body = "earth"

[world.sun]
position = [1.496e11, 0.0, 0.0]

[environment]

[environment.magnetic_field]
type = "centered_dipole"

[[spacecraft]]
name = "chief"  # operational identity: the COSMOS target derives from it (SAT_CHIEF)

[spacecraft.hub]
mass = 300.0

[spacecraft.hub.inertia]
ixx = 750.0
iyy = 620.0
izz = 540.0

[spacecraft.orbit]
type = "rv"

[spacecraft.orbit.rv]
position = [7.0e6, 0.0, 0.0]
# SI - metres per second. Circular at r=7000 km is sqrt(mu/r)=7546 m/s;
# this line once said 7.5461 (km/s), which the schema cannot refuse and
# gravity happily obeyed: the fleet free-fell until p5's velocity rule
# caught it. tests/test_fleet.py keeps that from returning.
velocity = [0.0, 7546.1, 0.0]

[spacecraft.attitude.initial]
sigma_BN = [0.05, -0.08, 0.11]
omega_BN_B = [0.05, -0.04, 0.03]

# --- actuators: three orthogonal reaction wheels -----------------------------
# max_torque 2 N m on a 750 kg m^2 bus closes the loop in tens of seconds;
# momentum capacity J*omega_max = 0.2 * 628 = 125 N m s per axis vs the ~37
# N m s the detumble from this tumble stores - comfortable, and saturation is
# still reachable if the law ever demands it (the effector clamps internally).

[[spacecraft.effectors]]
type = "reactionWheels"
inertia = 0.2

[[spacecraft.effectors.wheels]]
direction_B = [1.0, 0.0, 0.0]
max_speed = 628.0      # rad/s (6000 rpm)
max_torque = 2.0
jitter_model = "none"

[[spacecraft.effectors.wheels]]
direction_B = [0.0, 1.0, 0.0]
max_speed = 628.0
max_torque = 2.0
jitter_model = "none"

[[spacecraft.effectors.wheels]]
direction_B = [0.0, 0.0, 1.0]
max_speed = 628.0
max_torque = 2.0
jitter_model = "none"

# --- sensing: the suite the FSW gets to know the universe through -----------
# Bias mirrors sim/detumble_scenario.GYRO_BIAS_RADS; noise seeds are derived
# from the ModelTag by bskforge (deterministic per scenario, no Python RNG).

[[spacecraft.sensors]]
type = "imuSensor"
name = "imu"
gyro_bias = [2.0e-5, -1.5e-5, 1.0e-5]
gyro_walk = [1.0e-8, 1.0e-8, 1.0e-8]

[[spacecraft.sensors]]
type = "starTracker"
name = "st"
sigma_SB = [0.0, 0.0, 0.0]
white_noise = 1.0e-4

[[spacecraft.sensors]]
type = "coarseSunSensor"
name = "css1"
boresight_B = [1.0, 0.0, 0.0]
fov_deg = 60.0
noise_sigma = 0.005

[[spacecraft.sensors]]
type = "coarseSunSensor"
name = "css2"
boresight_B = [-1.0, 0.0, 0.0]
fov_deg = 60.0
noise_sigma = 0.005

[[spacecraft.sensors]]
type = "coarseSunSensor"
name = "css3"
boresight_B = [0.0, 1.0, 0.0]
fov_deg = 60.0
noise_sigma = 0.005

[[spacecraft.sensors]]
type = "coarseSunSensor"
name = "css4"
boresight_B = [0.0, -1.0, 0.0]
fov_deg = 60.0
noise_sigma = 0.005

[[spacecraft.sensors]]
type = "magnetometer"
name = "mag"
noise_sigma = 1.0e-8

# KN2 (D13): the vehicle's own GNSS opinion - the manifest picks the part,
# the plant builds a SimpleNav receiver from it. Delete this block and the
# NavState stream (0x08CF) goes silent: absence declared, not zero-filled.
[[spacecraft.sensors]]
type = "gpsReceiver"
name = "gnss"

[spacecraft.logging.state]
sample_time = 1.0
