# hohmann bench plant: the fuel-era transfer vehicle (Hohmann rung).
# Burn/fuel bench bones, three deliberate changes: a 150 kg bus (so the
# 5.5 kg tank is a 3.7% mass fraction - the linear fuel ledger stays honest
# while fuel still visibly BUDGETS the mission), born-quiet attitude (B is
# an inertial frame: a +Y-body ask near t=0 is inertial prograde, and a
# -Y-body ask half an orbit later is prograde again, no attitude authority
# needed on the bench), and an along-track PAIR rated for 50 N legs. The
# transfer this plant flies (all numbers MEASURED, not predicted): burn 1
# raises apoapsis 42.7 km, coast ~half an orbit (the physics WILL NOT hurry
# - the bench flies unpaced), burn 2 at the measured apoapsis circularizes, and one over-priced ask meets the
# dry door. Fuel earns its keep HERE: the orbit itself is the verdict.
#
#   uv run python -m sim.forge_scenario --scenario sim/scenarios/hohmann.toml --duration 60
# TOML. Pure plant on purpose - NO [spacecraft.fsw]: the flight software
# lives in cFS and commands through the lockstep link, and the burn quota
# rides it exactly like torque does (Rung 1: ground commands force along a
# body axis for a duration; Basilisk's effector owns the pulse pattern).
#
#   uv run python -m sim.forge_scenario --scenario sim/scenarios/burn.toml --duration 60
#
# The thruster lines differ from a flight cross-X in one deliberate way:
# every device sits in the body's center-of-mass plane (position_B all
# zeros), so a burn is PURE FORCE. Attitude interacts with thrust only when
# the Rung-2 accelerometer law starts caring about the difference; until
# then, a torque-coupled bench would grade the reaction wheels, not the
# burn. Ratings: four 5 N class devices on +/-X and +/-Y, so any in-plane
# axis up to 5 N per component is inside the plant's feasible cone.

[simulation]
name = "burn bench plant"
duration = 3600.0

[simulation.dt]
dynamics = 0.1
# fsw is the FSW tick: the world check, sensor frames, beacon and every
# anchored digest ride this rate. It must stay an integer multiple of
# dynamics, and retuning it re-anchors every baseline - full ceremony.
fsw = 1.0

[world]
central_body = "earth"

[world.sun]
position = [1.496e11, 0.0, 0.0]

[environment]

[environment.magnetic_field]
type = "centered_dipole"

[[spacecraft]]
name = "hohmann"  # operational identity: the COSMOS target derives from it (SAT_BURN)

[spacecraft.hub]
mass = 150.0

[spacecraft.hub.inertia]
ixx = 375.0
iyy = 310.0
izz = 270.0

[spacecraft.orbit]
type = "rv"

[spacecraft.orbit.rv]
position = [7.0e6, 0.0, 0.0]
# SI - metres per second (the chief's lesson: km/s here once free-fell the
# fleet; see the comment in chief.toml).
velocity = [0.0, 7546.1, 0.0]

[spacecraft.attitude.initial]
sigma_BN = [0.0, 0.0, 0.0]
omega_BN_B = [0.0, 0.0, 0.0]

# --- actuators: three orthogonal reaction wheels -----------------------------
# The burn is translation; the wheels keep owning attitude, undisturbed by a
# line of thrust through the CoM.

[[spacecraft.effectors]]
type = "reactionWheels"
inertia = 0.2

[[spacecraft.effectors.wheels]]
direction_B = [1.0, 0.0, 0.0]
max_speed = 628.0      # rad/s (6000 rpm)
max_torque = 2.0
jitter_model = "none"

[[spacecraft.effectors.wheels]]
direction_B = [0.0, 1.0, 0.0]
max_speed = 628.0
max_torque = 2.0
jitter_model = "none"

[[spacecraft.effectors.wheels]]
direction_B = [0.0, 0.0, 1.0]
max_speed = 628.0
max_torque = 2.0
jitter_model = "none"

# --- thrusters: four 5 N devices, cross-X directions, CoM-plane lines --------
# Co-located at the hub origin on purpose: pure force, no moment (see the
# header). max_thrust forwards as MaxThrust; the simIncludeThruster blank
# preset takes its characteristics from these knobs. MinOnTime keeps its
# 20 ms default - the effector's own pulse floor, inside one tick's quota.

[[spacecraft.effectors]]
type = "thrusters"

[[spacecraft.effectors.thrusters]]
direction_B = [1.0, 0.0, 0.0]
position_B = [0.0, 0.0, 0.0]
max_thrust = 30.0

[[spacecraft.effectors.thrusters]]
direction_B = [-1.0, 0.0, 0.0]
position_B = [0.0, 0.0, 0.0]
max_thrust = 30.0

[[spacecraft.effectors.thrusters]]
direction_B = [0.0, 1.0, 0.0]
position_B = [0.0, 0.0, 0.0]
max_thrust = 30.0

# The along-track PAIRS are the point: 60 N of +Y capability lets a 50 N leg
# fly at 83% duty, and the allocator's co-located rule (same-direction
# devices spend the axis's demand pro-rata, room summed) flies for the first
# time here - the fuel bench's single-device plant never touched it. The
# first measurement flight proved the yard counts an over-capability ask as a
# saturated shortfall (30 N applied against a 50 N ask, truth-visible);
# with the pair, a leg is honest authority, not a counted clip.
[[spacecraft.effectors.thrusters]]
direction_B = [0.0, 1.0, 0.0]
position_B = [0.0, 0.0, 0.0]
max_thrust = 30.0

[[spacecraft.effectors.thrusters]]
direction_B = [0.0, -1.0, 0.0]
position_B = [0.0, 0.0, 0.0]
max_thrust = 30.0

[[spacecraft.effectors.thrusters]]
direction_B = [0.0, -1.0, 0.0]
position_B = [0.0, 0.0, 0.0]
max_thrust = 30.0

# --- fuel: the 5.5 kg tank that BUDGETS the transfer ----------------------------
# MEASURED prices (offline measurement flight, this plant, Isp 100 s factory):
# burn 1 (50 N, 36 s) costs 1.8355 kg and raises apoapsis 42.7 km; burn 2
# (50 N, 34 s at the detected apoapsis) costs 1.7335 kg and circularizes;
# 1.93 kg survive - and the over-ask leg (50 N, 240 s, priced 12.24 kg) is
# exactly the ask that CANNOT be bought. Fuel is the mission budget here.
[spacecraft.effectors.fuel_tank]
fuel_mass = 5.5

# --- sensing: the suite the FSW gets to know the universe through -----------
# Bias mirrors sim/detumble_scenario.GYRO_BIAS_RADS; noise seeds are derived
# from the ModelTag by bskforge (deterministic per scenario, no Python RNG).

[[spacecraft.sensors]]
type = "imuSensor"
name = "imu"
gyro_bias = [2.0e-5, -1.5e-5, 1.0e-5]
gyro_walk = [1.0e-8, 1.0e-8, 1.0e-8]

[[spacecraft.sensors]]
type = "starTracker"
name = "st"
sigma_SB = [0.0, 0.0, 0.0]
white_noise = 1.0e-4

[[spacecraft.sensors]]
type = "coarseSunSensor"
name = "css1"
boresight_B = [1.0, 0.0, 0.0]
fov_deg = 60.0
noise_sigma = 0.005

[[spacecraft.sensors]]
type = "coarseSunSensor"
name = "css2"
boresight_B = [-1.0, 0.0, 0.0]
fov_deg = 60.0
noise_sigma = 0.005

[[spacecraft.sensors]]
type = "coarseSunSensor"
name = "css3"
boresight_B = [0.0, 1.0, 0.0]
fov_deg = 60.0
noise_sigma = 0.005

[[spacecraft.sensors]]
type = "coarseSunSensor"
name = "css4"
boresight_B = [0.0, -1.0, 0.0]
fov_deg = 60.0
noise_sigma = 0.005

[[spacecraft.sensors]]
type = "magnetometer"
name = "mag"
noise_sigma = 1.0e-8

[[spacecraft.sensors]]
type = "gpsReceiver"
name = "gnss"

[spacecraft.logging.state]
sample_time = 1.0
