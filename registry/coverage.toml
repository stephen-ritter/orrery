[[type]]
name = "camera"
kind = "sensor"
status = "catalog-unlanded"
bskforge = "schema+builder"
wire = ""
first_hop = "registry-row"
scenarios = []
phase = "CAM"
why = """bskforge builds the pinhole + landmark device today; what is missing is
entirely ours: a row, a byte-segment container (EDS arrays flatten to _0.._n),
a provider reading the device message, and a p5 compare mode for pixels - which
p5 will REFUSE to run until it exists, by design."""

# --- effectors --------------------------------------------------------------
# An effector's telemetry is knowledge (and rides a row); its actuation is a
# COMMAND path (and never does). reactionWheels is the only one where both halves
# fly, which is why it is the reference case for the rest of this section.

[[type]]
name = "reactionWheels"
kind = "effector"
status = "landed"
bskforge = "schema+builder"
wire = "BSK_LINK/OnboardState -> BSK_LINK_ONBOARD_STATE_TLM (speeds back)"
command_path = "COSMOS -> fcs law -> BSK_LINK/TorqueCommand -> the plant"
first_hop = ""
scenarios = ["chief.toml", "twin_ops.toml"]
phase = ""
why = """The closed loop the project is built on: FSW computes, the world
applies, the digest records. Every other effector wants this same shape."""

[[type]]
name = "mtb"
kind = "effector"
status = "command-path"
bskforge = "schema+builder"
command_path = "missing: no FSW dipole law and no command frame to the plant"
first_hop = "fsw-command"
scenarios = []
phase = "P9"
why = """The magnetometer already streams the field, so sensing is done; what is
missing is the torque rod and the law that commands it. Momentum management is
attitude *supervision*, which is the safe-mode study - declaring the effector
before the law exists would give the fleet a coil nobody drives."""

[[type]]
name = "thrusters"
kind = "effector"
status = "command-path"
bskforge = "schema+builder"
command_path = """partial: sps schedules pulses on the bus; nothing turns them into
    forces world-side"""
first_hop = "fsw-command"
scenarios = []
phase = "P9"
why = """The cheapest-looking gap here: the SPS app exists and already uploads
and runs a schedule, but the pulse terminates at the bus. Closing it needs a
force path (and then pulse-width physics inside a 1 Hz lockstep tick, which is
the actual hard part - a thruster wants a faster tick than attitude does)."""

[[type]]
name = "drag"
kind = "disturbance"
status = "refused"
bskforge = "schema+builder"
command_path = "disturbance model, not a command"
first_hop = "decision"
scenarios = []
phase = "P7"
why = """Not refused on principle - refused on evidence. Drag decays every
pinned trajectory, and the project's whole argument is a digest ledger that
means something; until per-configuration baselines exist, adding atmospheric
decay would trade the audit for realism. Revisit when digests are keyed to
sha256(TOML + registry + app list)."""

[[type]]
name = "solarRadiationPressure"
kind = "disturbance"
status = "refused"
bskforge = "schema+builder"
command_path = "disturbance model, not a command"
first_hop = "decision"
scenarios = []
phase = "P7"
why = """Same ruling as drag, same reason: a real orbit-secularizing
disturbance lands with per-configuration baselines, not before them."""

[[type]]
name = "gravityGradient"
kind = "disturbance"
status = "refused"
bskforge = "schema+builder"
command_path = "disturbance model, not a command"
first_hop = "decision"
scenarios = []
phase = "P7"
why = """Gravity-gradient torque on an extended body would change the attitude
trajectory the ledger pins - and unlike drag it is a TORQUE, so it lands in the
control loop rather than beside it."""

# --- scenario areas ---------------------------------------------------------
# The other half of "all assets": whole sections of bskforge's root schema.
# These are classified too, because a section added upstream is a capability we
# have not decided about.

[[area]]
name = "simulation"
status = "used"
why = """Schedule, stop time, seed: the world's clock is a scenario decision,
never a code constant."""

[[area]]
name = "world"
status = "used"
why = """Gravity and ephemeris: the trajectory every baseline pins is a world
file's output."""

[[area]]
name = "environment"
status = "used"
why = """centered_dipole is the magnetic field the magnetometer reads - which is
why that sensor's numbers mean something."""

[[area]]
name = "spacecraft"
status = "used"
why = """The vehicle manifest itself: every [[spacecraft]] block is a mission
container, a truth target, and a slot in one world."""

[[area]]
name = "comm_links"
status = "unused-with-reason"
why = """No inter-satellite link is modelled; the twins are graded as one world
through truth, not through each other. Constellation work is where a
cross-link becomes a first-class wire."""

[[area]]
name = "formations"
status = "unused-with-reason"
why = """Relative-motion holding would move the anchored twin digests, and the
project would lose the strongest artifact it has - a pair of trajectories that
reproduce bit-for-bit. Revisit when relative motion is the mission, and
re-found the pair deliberately when it does."""

[[area]]
name = "logging"
status = "unused-with-reason"
why = """The harness records its own ledgers (trajectory digests, wire audits,
truth gateways); bskforge's recorders would be a second, less audited copy of
the same story."""

[[area]]
name = "visualization"
status = "unused-with-reason"
why = """The operator's window is COSMOS, and it is graded: a viz path that no
gate reads is decoration, and decoration in this repo tends to become a claim."""

[[area]]
name = "camera"
status = "unused-with-reason"
why = """bskforge grew the instrument type (v0.4.0: Vizard renders into the
camera module, images arrive on opnavImageOutMsg), but no scenario flies one yet
and the OpNav knowledge channel it would feed has no exhibit grading its numbers.
It lands with its own gates - the anchored digests must print unchanged with the
camera on - not before."""

[[area]]
name = "custom"
status = "banned"
why = """Hardware is declared by naming a type, never wired in by hand. Fleets are
read through bskforge's audited profile, which sim/fleet_policy.py asks for, so
this is refused at load rather than by omission. The reason is mechanical:
hardware no schema type names cannot have a registry row, so the fit manifest
never declares it, this ledger has no union to classify it under, no defs carry
it, and no exhibit could judge its numbers - its readings would be a wire nothing
grades. The route for hardware upstream cannot model yet is the one gpsReceiver
took: grow the type upstream, with its own tests, and land a row here afterwards.
This ledger is what makes that route survivable: it names every gap a hand-wired
device would have papered over, and who owns each one."""

[[area]]
name = "monte_carlo"
status = "unused-with-reason"
why = """Dispersion studies need per-configuration digests (a distribution is
meaningless against one pinned trajectory), so this is the per-configuration digest round's customer rather than
a gap today."""
