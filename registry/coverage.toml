# Parts coverage ledger: every asset bskforge exposes, classified.
#
# registry/parts.toml says what a part MEANS on the wire. This file answers the
# adjacent question, which is the one operators keep asking and which no other
# file could answer honestly: which parts does this project actually support,
# which does it refuse, and what is the first missing hop for the rest.
#
# AUTHORITATIVE and machine-checked (tests/test_coverage.py):
#
#   * every first-class bskforge SENSOR and EFFECTOR type must appear here
#     exactly once, so a part added upstream fails OUR build until we classify
#     it - catalog before factory, pointed at ourselves;
#   * every scenario section in bskforge's root schema must appear in [[area]];
#   * status = "landed" agrees both ways with registry/parts.toml (a row that
#     landed without a classification, or a classification that outlived its
#     row, both fail);
#   * every unlanded part names its FIRST missing hop from a fixed vocabulary
#     and carries a reason - "we haven't gotten to it" is not a classification;
#   * docs/coverage.md is this file rendered, byte-checked, so the summary
#     number can never be better than the ledger.
#
# Upstream is NOT the constraint: bskforge builds all twelve of these types
# today (schema + builder, verified against build/sensors.py, build/effectors.py
# and build/disturbances.py). Every gap below is ours.

# --- status vocabulary ------------------------------------------------------
#
#   landed            a landed registry row exists and the circuit flies
#   barrier           crosses as the barrier tick itself; never a row
#   catalog-unlanded  schema + builder exist, no row, no wire yet
#   command-path      not knowledge: it actuates, so it lands through fcs/sps
#                     and never earns a MsgId of its own
#   refused           a decision with a reason, not a gap

# --- sensors ----------------------------------------------------------------

[[type]]
name = "imuSensor"
kind = "sensor"
status = "barrier"
bskforge = "schema+builder"
wire = "BSK_LINK/SensorFrame (the tick itself)"
first_hop = ""
scenarios = ["chief.toml", "twin_ops.toml"]
owner = ""
why = """Rate knowledge is the lockstep tick, not an observability part: it is the
frame every control law is frame-exact against. Giving it a registry row would
put the barrier on the same footing as a payload instrument (sim/lockstep.py
keeps SENSOR/ACK/CMD hardcoded on purpose)."""

