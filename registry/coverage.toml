control loop rather than beside it."""

# --- scenario areas ---------------------------------------------------------
# The other half of "all assets": whole sections of bskforge's root schema.
# These are classified too, because a section added upstream is a capability we
# have not decided about.

[[area]]
name = "simulation"
status = "used"
why = """Schedule, stop time, seed: the world's clock is a scenario decision,
never a code constant."""

[[area]]
name = "world"
status = "used"
why = """Gravity and ephemeris: the trajectory every baseline pins is a world
file's output."""

[[area]]
name = "environment"
status = "used"
why = """centered_dipole is the magnetic field the magnetometer reads - which is
why that sensor's numbers mean something."""

[[area]]
name = "spacecraft"
status = "used"
why = """The vehicle manifest itself: every [[spacecraft]] block is a mission
container, a truth target, and a slot in one world."""

[[area]]
name = "comm_links"
status = "unused-with-reason"
why = """No inter-satellite link is modelled; the twins are graded as one world
through truth, not through each other. Constellation work is where a
cross-link becomes a first-class wire."""

[[area]]
name = "formations"
status = "unused-with-reason"
why = """Relative-motion holding would move the anchored twin digests, and the
project would lose the strongest artifact it has - a pair of trajectories that
reproduce bit-for-bit. Revisit when relative motion is the mission, and
re-found the pair deliberately when it does."""

[[area]]
name = "logging"
status = "unused-with-reason"
why = """The harness records its own ledgers (trajectory digests, wire audits,
truth gateways); bskforge's recorders would be a second, less audited copy of
the same story."""

[[area]]
name = "visualization"
status = "unused-with-reason"
why = """The operator's window is COSMOS, and it is graded: a viz path that no
check reads is decoration, and decoration in this repo tends to become a claim."""

[[area]]
name = "camera"
status = "unused-with-reason"
why = """the circuit landed (row, wire, firmware table, vizard.lock-pinned renderer),
but this area measures YARD usage: it flips to `used` when camera_ops.toml has
flown the pair check - the LOS exhibit on the live fleet and the anchored digest
printing unchanged with and without the trailing camera sections. Declared
before flown: the ledger is a map, not a wish."""

[[area]]
name = "store"
status = "used"
why = """The recorder a store outlet writes into, sized before flight:
`capacity_bytes` bounds the volume and `capacity_files` bounds the index's
reach, because frame size follows the scene and a byte-only law cannot say
when its own listing outgrows an honest count. The flying scenario's rows
are compiled into the plane (codegen/emit_store), and bsk_link obeys them
under the queue law: a capture is admitted when the recorder has headroom;
a frame whose receipt landed is recycled the moment the receipt lands,
pressure or not; a full recorder with nothing proven refuses new captures
and says so on the event bus. The receipt is the vehicle's own witness,
never the ground's word: CF was handed an acknowledged (class 2) transfer,
and CF's end-of-transaction report closed that exact path clean. The store
remembers itself: /cf/img/.catalog carries path, size, creation, and the
proven bit, rewritten atomically on every mutation and read back at boot
with one-directional nets - a standing file no line vouches for joins
UNPROVEN, a line whose file is gone is dropped with an event. The
inventory is the store's own publication: bsk_link walks the directory and
rewrites /cf/manifest.txt at the boot census and at every mutation it
performs, draft-and-swap like the catalog, because the app that admits,
lands, and recycles files is the only author who can never be behind its
own story. No command opens or refreshes the ledger anymore - CAM_CMD FC 1
is retired (a stray one is counted and refused), and the ground simply
fetches the file, always current. The store also answers to the present
tense: CAM_CMD FC 2 SNAP pulses the shutter - the sim door opens a closed
eye, delivers the NEXT capture (never an old file) to the store outside the
record cadence, and restores the ground's steady shutter; the ask and the
delivery are separate witnesses (CAM_HK.SnapshotCmds vs CamState.Snapshots),
and an unanswered pulse is dropped uncounted rather than counted falsely.
The outlet's door is itself a scenario fact: `record_rate` files every Nth
capture, `record_mode = "snap"` files ONLY pulse deliveries - an eye streams
for the estimator forever while the store stays silent until the ground
asks - and the schema refuses both doors on one outlet.
What remains: the working index is still door-lawed to the manifest's sort
budget (512 entries), and a receipt carried across a restart is spent by
the next capture - boot records deliveries, it does not perform them."""

[[area]]
name = "custom"
status = "banned"
why = """Hardware is declared by naming a type, never wired in by hand. Fleets are
read through bskforge's audited profile, which sim/fleet_policy.py asks for, so
this is refused at load rather than by omission. The reason is mechanical:
hardware no schema type names cannot have a registry row, so the fit manifest
never declares it, this ledger has no union to classify it under, no defs carry
it, and no exhibit could judge its numbers - its readings would be a wire nothing
grades. The route for hardware upstream cannot model yet is the one gpsReceiver
took: grow the type upstream, with its own tests, and land a row here afterwards.
This ledger is what makes that route survivable: it names every gap a hand-wired
device would have papered over, and who owns each one."""

[[area]]
name = "monte_carlo"
status = "unused-with-reason"
why = """Dispersion studies need per-configuration digests (a distribution is
meaningless against one pinned trajectory), so this is the per-configuration digest round's customer rather than
a gap today."""
