[[type]]
name = "camera"
kind = "sensor"
status = "landed"
bskforge = "schema+builder"
wire = "BSK_LINK/OpNavState -> 0x08D1"
first_hop = ""
scenarios = ["camera_ops.toml", "twin_cam.toml", "formation_eye.toml"]
owner = ""
why = """Vizard paints the frame, the Basilisk camera module receives it, and the
limb/horizon estimators turn pixels into a planet vector - the OPNAV frame
carries that KNOWLEDGE (LOS + verdict flags), never the image. The exhibit
grades the LOS against truth rotated into body, bounded by the declared FOV;
the renderer itself is pinned by vizard.lock and mounts as a compose profile.
When the world carries a second vehicle the same capture PAINTS it:
scripts/check_formation_eye.sh flies a 100 m hover and fits the blob's crawl
to the orbit law. Measured scale law - the default model renders TRUE-size
(~2 m, legible 50-500 m, sub-pixel by ~1 km); named model_key meshes are
authored for the planet view and render kilometers across up close, so they
are forbidden in formation plants."""

# --- effectors --------------------------------------------------------------
# An effector's telemetry is knowledge (and rides a row); its actuation is a
# COMMAND path (and never does). reactionWheels is the only one where both halves
# fly, which is why it is the reference case for the rest of this section.

[[type]]
name = "reactionWheels"
kind = "effector"
status = "landed"
bskforge = "schema+builder"
wire = "BSK_LINK/OnboardState -> BSK_LINK_ONBOARD_STATE_TLM (speeds back)"
command_path = "COSMOS -> fcs law -> BSK_LINK/TorqueCommand -> the plant"
first_hop = ""
scenarios = ["chief.toml", "twin_ops.toml"]
owner = ""
why = """The closed loop the project is built on: FSW computes, the world
applies, the digest records. Every other effector wants this same shape."""

[[type]]
name = "mtb"
kind = "effector"
status = "command-path"
bskforge = "schema+builder"
command_path = "missing: no FSW dipole law and no command frame to the plant"
first_hop = "fsw-command"
scenarios = []
owner = "authority"
why = """The magnetometer already streams the field, so sensing is done; what is
missing is the torque rod and the law that commands it. Momentum management is
attitude *supervision*, which is the safe-mode study - declaring the effector
before the law exists would give the fleet a coil nobody drives."""

[[type]]
name = "thrusters"
kind = "effector"
status = "command-path"
bskforge = "schema+builder"
command_path = """COSMOS/ground -> FCS_BURN quota -> fcs doors (nonsense and overlap
    refused) -> one BurnCommand per tick -> BSK_LINK/BURN egress -> thruster_alloc ->
    the world's fuel door (tank priced per tick: throttle, starve) -> force
    world-side; claims ride FCS_HK, applied AND fuel ride TRUTH (bench only)"""
first_hop = "provider"
scenarios = ["burn.toml", "fuel.toml", "hohmann.toml"]
owner = "authority"
why = """The quota law flies since 2026-11-27: the ground commands
{force, duration, axis}, the craft doors it and egresses one BurnCommand per tick
(a silent craft stops thrusting by construction), the world allocates on-times
group-wise against device caps and counts saturated ticks - claim 54.0 N s against
applied 42.0 is the bench's published exhibit, not a discrepancy. Since the fuel
rung (2026-11-28) the plant can declare a tank (bskforge fuel_tank): the world
prices every tick's ask against the tank's native books, throttles what it cannot
cover, and starves whole ticks at EXACT zero - while the craft, fuel-blind by
design (no sensor, no fuel claim), keeps claiming what it was given. The fuel
bench's published exhibit: claim 327 N s against applied 49.1, tank EXACTLY 0.0 kg,
55 starved ticks. The Hohmann rung (2026-11-28) made fuel the MISSION budget: the transfer
is composed ground-side from plain FCS_BURN legs (no HOHMANN command exists, on purpose -
primitives fly, procedures compose), leg 2 fires at the apoapsis MEASURED on the truth
stream (radial-velocity flip; nothing predicted), and the verdict is the orbit itself -
e 3.0e-3 to 1.44e-4, r held to 64 m over a 240 s confirmation coast. The over-priced third
ask (12.24 kg against 1.93 surviving) bought ~38 ticks, throttled 2, starved 201: claim
15,500 N s against applied 5,395, tank to the exact-zero clamp - and the survivors' partial
burn re-elliptized the orbit (e 3.3e-3 after), physics refusing to hide the shortfall.
What keeps this row command-path is knowledge, not force: the world's applied
ledger rides TRUTH, which is the bench's stream and never the bus. The path to
landed is the one the camera walked - a forge-sampled BurnState (fuel rows
included) forwarded by bsk_link, the provider hop."""

[[type]]
name = "drag"
kind = "disturbance"
status = "refused"
bskforge = "schema+builder"
command_path = "disturbance model, not a command"
first_hop = "decision"
scenarios = []
owner = "digest"
why = """Not refused on principle - refused on evidence. Drag decays every
pinned trajectory, and the project's whole argument is a digest ledger that
means something; until per-configuration baselines exist, adding atmospheric
decay would trade the audit for realism. Revisit when digests are keyed to
sha256(TOML + registry + app list)."""

