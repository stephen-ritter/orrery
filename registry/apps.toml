# orrery app inventory - what the core is allowed to wake, and on whose word.
#
# One [[app]] row per module the ES startup table can name, in boot order
# (the startup file IS an order: ES starts apps as it reads them). The
# startup generator (codegen/emit_startup.py) reads this file plus the parts
# registry's fsw_apps fields to answer one question per vehicle: which apps
# does this scenario's declaration wake? Everything here is one visible
# sentence; the fallback table the image installs is pinned equal to the
# all-parts union by tests/test_startup_table.py - two sources of one
# grammar, checked against each other.
#
# Field notes:
#   class       the ES entry type: CFE_APP or CFE_LIB (drivers/tasks would
#               be legal too; this fleet has none yet).
#   entry       the module's entry symbol; short    its ES short name;
#               priority/stack/flags/load ride the startup record verbatim -
#               the values the yard has always booted with.
#   when        "baseline"  = the vehicle's plumbing: every vehicle, every
#                            scenario, by declaration instead of by comment.
#               "declared"  = payload authority: wakes only on a vehicle
#                            whose scenario mounts a part whose fsw_apps
#                            names this app (registry/parts.toml).
#   eds_packages  the EDS package names this app owns (the target_app on a
#               generated ground definition). The ground-scope generator
#               (codegen/eds2cosmos --scope-scenario) cuts a vehicle's
#               dictionary with it: no command for an app that vehicle never
#               wakes. CFE_* packages belong to the core and are nobody's to
#               scope away; a packet whose package no app owns is a door
#               refusal, not a silent pass.
#   requires    entailments: apps this one needs awake on the same bus.
#   shipped_with  "core" = built by the core or the per-CPU lists (sch_lab,
#               the assert lib): present on every image whatever
#               the scenario says, outside the scenario's build fragment
#               (codegen/emit_applist). Absent = the mission builds it, and
#               the scenario's wake list decides whether it exists at all.
#               The generator refuses an unsatisfiable wake list with a
#               named sentence - "you asked for the manifest but no
#               file-transfer engine" is a door, not a segfault.
#
# The grammar law this file obeys: cFE's startup parser knows commas as
# field delimiters, ';' as end-of-record, and '!' as end-of-file - it has NO
# comments. This registry is the comment-free file's comment-bearing twin.
#
# --- 2026-11-27: the prebaked-app purge --------------------------------------
#
# This inventory once carried thirteen modules the yard never spoke to: hk hs
# lc mm sc md ds cs fm ci_lab to_lab sample_app sample_lib. An audit of every
# bench, probe, test, screen and doc found ZERO live consumers - not one send
# to their commands, not one listener to their telemetry. Each role was
# already rebuilt where the mission needs it: gs_tcp is the uplink (ci_lab)
# and the beacon (to_lab), SPS is the stored-command service (sc), obc_hk is
# the health observer (hs, hk), and CF plus the bsk_link store move the files
# (fm, ds, mm, md). The labs and samples were the cFS demo organ: 13 tasks
# booted, ~22 boot tables parsed, half the ground command dictionary (31 of
# 63 packets) and 55% of the SPS schedulable rows served nobody.
#
# Retirement is total, on the FC 1 precedent: no optional tier was invented,
# the rows leave the registry, their bundle EDS packages leave the defs, and
# their MIDs and event IDs go unclaimed - old logs still decode, and if a
# watchdog law ever needs HS, the row comes back and git remembers it was
# here. Half-measures cannot sneak in: a registry row owns its EDS packages,
# so a dropped row orphans packets the ground-scope door REFUSES to build.

schema_version = 1

# --- the vehicle's plumbing: baseline, in boot order -------------------------

[[app]]
name = "cfe_assert"
class = "CFE_LIB"
entry = "CFE_Assert_LibInit"
short = "ASSERT_LIB"
priority = 0
stack = 0
when = "baseline"
shipped_with = "core"

[[app]]
name = "sch_lab"
class = "CFE_APP"
entry = "SCH_LAB_AppMain"
short = "SCH_LAB"
priority = 35
stack = 32768
when = "baseline"
shipped_with = "core"

[[app]]
name = "bsk_link"
class = "CFE_APP"
entry = "BSK_LINK_AppMain"
short = "BSK_LINK"
priority = 55
stack = 131072
when = "baseline"
eds_packages = ["BSK_LINK"]

[[app]]
name = "fcs"
class = "CFE_APP"
entry = "FCS_AppMain"
short = "FCS"
priority = 65
stack = 65536
when = "baseline"
eds_packages = ["FCS"]

[[app]]
name = "obc_hk"
class = "CFE_APP"
entry = "OBC_HK_AppMain"
short = "OBC_HK"
priority = 66
stack = 65536
when = "baseline"
eds_packages = ["OBC"]

[[app]]
name = "sps"
class = "CFE_APP"
entry = "SPS_AppMain"
short = "SPS"
priority = 67
stack = 65536
when = "baseline"
eds_packages = ["SPS"]

# --- the payload authorities: woken by declaration ---------------------------
#
# cam sits between sps and cf_tcp in boot order for a mundane reason: that
# is where the yard has always booted it, and a declared flight's table must
# stay byte-equivalent in MEANING to the table that earned the digests.
# Its entailments: the store's request path answers through CF and the PDU
# bridge - ask for the manifest without them and the promise is a lie, so
# the door says so at boot time, not at request time.

[[app]]
name = "cam"
class = "CFE_APP"
entry = "CAM_AppMain"
short = "CAM"
priority = 68
stack = 65536
when = "declared"
eds_packages = ["CAM"]
requires = ["cf", "cf_tcp"]

[[app]]
name = "cf_tcp"
class = "CFE_APP"
entry = "CF_TCP_AppMain"
short = "CF_TCP"
priority = 69
stack = 65536
when = "baseline"

# --- plumbing again: the ground door, then the file-transfer engine -----------

[[app]]
name = "gs_tcp"
class = "CFE_APP"
entry = "GS_TCP_AppMain"
short = "GS_TCP"
priority = 60
stack = 65536
when = "baseline"

[[app]]
name = "cf"
class = "CFE_APP"
entry = "CF_AppMain"
short = "CF"
priority = 70
stack = 131072
when = "baseline"
eds_packages = ["CF"]
