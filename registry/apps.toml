# --- the payload authorities: woken by declaration ---------------------------
#
# cam sits between sps and cf_tcp in boot order for a mundane reason: that
# is where the yard has always booted it, and a declared flight's table must
# stay byte-equivalent in MEANING to the table that earned the digests.
# Its entailments: the store's request path answers through CF and the PDU
# bridge - ask for the manifest without them and the promise is a lie, so
# the door says so at boot time, not at request time.

[[app]]
name = "cam"
class = "CFE_APP"
entry = "CAM_AppMain"
short = "CAM"
priority = 68
stack = 65536
when = "declared"
eds_packages = ["CAM"]
requires = ["cf", "cf_tcp"]

[[app]]
name = "cf_tcp"
class = "CFE_APP"
entry = "CF_TCP_AppMain"
short = "CF_TCP"
priority = 69
stack = 65536
when = "baseline"

