# orrery app inventory - what the core is allowed to wake, and on whose word.
#
# One [[app]] row per module the ES startup table can name, in boot order
# (the startup file IS an order: ES starts apps as it reads them). The
# startup generator (codegen/emit_startup.py) reads this file plus the parts
# registry's fsw_apps fields to answer one question per vehicle: which apps
# does this scenario's declaration wake? Everything here is one visible
# sentence; the fallback table the image installs is pinned equal to the
# all-parts union by tests/test_startup_table.py - two sources of one
# grammar, checked against each other.
#
# Field notes:
#   class       the ES entry type: CFE_APP or CFE_LIB (drivers/tasks would
#               be legal too; this fleet has none yet).
#   entry       the module's entry symbol; short    its ES short name;
#               priority/stack/flags/load ride the startup record verbatim -
#               the values the yard has always booted with.
#   when        "baseline"  = the vehicle's plumbing: every vehicle, every
#                            scenario, by declaration instead of by comment.
#               "declared"  = payload authority: wakes only on a vehicle
#                            whose scenario mounts a part whose fsw_apps
#                            names this app (registry/parts.toml).
#   eds_packages  the EDS package names this app owns (the target_app on a
#               generated ground definition). The ground-scope generator
#               (codegen/eds2cosmos --scope-scenario) cuts a vehicle's
#               dictionary with it: no command for an app that vehicle never
#               wakes. CFE_* packages belong to the core and are nobody's to
#               scope away; a packet whose package no app owns is a door
#               refusal, not a silent pass.
#   requires    entailments: apps this one needs awake on the same bus.
#   shipped_with  "core" = built by the core or the per-CPU lists (sch_lab,
#               the labs, the assert lib): present on every image whatever
#               the scenario says, outside the scenario's build fragment
#               (codegen/emit_applist). Absent = the mission builds it, and
#               the scenario's wake list decides whether it exists at all.
#               The generator refuses an unsatisfiable wake list with a
#               named sentence - "you asked for the manifest but no
#               file-transfer engine" is a door, not a segfault.
#
# The grammar law this file obeys: cFE's startup parser knows commas as
# field delimiters, ';' as end-of-record, and '!' as end-of-file - it has NO
# comments. This registry is the comment-free file's comment-bearing twin.

schema_version = 1

# --- the vehicle's plumbing: baseline, in boot order -------------------------

[[app]]
name = "cfe_assert"
class = "CFE_LIB"
entry = "CFE_Assert_LibInit"
short = "ASSERT_LIB"
priority = 0
stack = 0
when = "baseline"
shipped_with = "core"

[[app]]
name = "sample_lib"
class = "CFE_LIB"
entry = "SAMPLE_LIB_Init"
short = "SAMPLE_LIB"
priority = 0
stack = 0
when = "baseline"

[[app]]
name = "sch_lab"
class = "CFE_APP"
entry = "SCH_LAB_AppMain"
short = "SCH_LAB"
priority = 35
stack = 32768
